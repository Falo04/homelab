# restic backups of one PersistentVolumeClaim: CronJob and the Vault-backed
# Garage credentials.
#
# Usage, in the app's kustomization.yaml:
#
#   namespace: <app>
#   resources:
#     - pvc-backup-values.yaml   # see below
#     - pvc.yaml
#   components:
#     - ../../../base/pvc-backup
#
# and a pvc-backup-values.yaml next to it:
#
#   apiVersion: v1
#   kind: ConfigMap
#   metadata:
#     name: pvc-backup-values
#   data:
#     claimName: <app>-data
#     repository: s3:https://s3.nas.felixwallner.com/<app>-bucket/restic
#     vaultMount: k3s-services
#     vaultPath: <app>/backup
#     sqliteDatabases: "db/<app>.db"   # PVC-relative, space separated, may be ""
#
# Everything else (schedule, retention, images, resources) is a shared default
# in cronjob.yaml; override per app with a `patches:` entry if one needs to
# differ. One CronJob per namespace -- a second PVC in the same namespace needs
# a nameSuffix patch.
---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - backup-secret.yaml
  - cronjob.yaml

replacements:
  - source:
      kind: ConfigMap
      name: pvc-backup-values
      fieldPath: data.claimName
    targets:
      - select:
          kind: CronJob
          name: pvc-backup
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.volumes.[name=data].persistentVolumeClaim.claimName
          - spec.jobTemplate.spec.template.spec.containers.[name=restic].env.[name=RESTIC_HOST].value

  - source:
      kind: ConfigMap
      name: pvc-backup-values
      fieldPath: data.repository
    targets:
      - select:
          kind: CronJob
          name: pvc-backup
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.[name=restic].env.[name=RESTIC_REPOSITORY].value

  - source:
      kind: ConfigMap
      name: pvc-backup-values
      fieldPath: data.sqliteDatabases
    targets:
      - select:
          kind: CronJob
          name: pvc-backup
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.initContainers.[name=sqlite-snapshot].env.[name=SQLITE_DATABASES].value
          - spec.jobTemplate.spec.template.spec.containers.[name=restic].env.[name=SQLITE_DATABASES].value

  - source:
      kind: ConfigMap
      name: pvc-backup-values
      fieldPath: data.vaultMount
    targets:
      - select:
          kind: VaultStaticSecret
          name: vault-pvc-backup
        fieldPaths:
          - spec.mount

  - source:
      kind: ConfigMap
      name: pvc-backup-values
      fieldPath: data.vaultPath
    targets:
      - select:
          kind: VaultStaticSecret
          name: vault-pvc-backup
        fieldPaths:
          - spec.path
