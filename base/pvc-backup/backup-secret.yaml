# Garage access key plus the restic repository password.
# keys: `ACCESS_KEY_ID` / `ACCESS_SECRET_KEY` / `RESTIC_PASSWORD`
#
# The first two match the convention in ../cnpg-backup, so an app that already
# has a Garage key only needs `RESTIC_PASSWORD` added alongside it.
# `spec.mount` and `spec.path` are filled in from the app's
# pvc-backup-values ConfigMap.
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-pvc-backup
spec:
  vaultAuthRef: vault-k8s
  mount: REPLACED-BY-VALUES
  type: kv-v2
  path: REPLACED-BY-VALUES
  refreshAfter: 1h
  destination:
    create: true
    name: pvc-backup-s3
