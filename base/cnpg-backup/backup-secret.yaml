# Garage access key for this cluster's bucket.
# keys: `ACCESS_KEY_ID` / `ACCESS_SECRET_KEY`
# `spec.path` is filled in from the app's cnpg-backup-values ConfigMap.
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-cnpg-backup
spec:
  vaultAuthRef: vault-k8s
  mount: k3s-infra
  type: kv-v2
  path: REPLACED-BY-VALUES
  refreshAfter: 1h
  destination:
    create: true
    name: cnpg-backup-s3
