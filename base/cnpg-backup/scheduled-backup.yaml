# 03:00 daily (CNPG cron has seconds first).
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cnpg-backup
spec:
  schedule: "0 0 3 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: REPLACED-BY-VALUES
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
