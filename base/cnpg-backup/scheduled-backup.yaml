# CNPG cron is 6-field with seconds leading: this is 03:00 daily.
# `spec.cluster.name` is filled in from the app's cnpg-backup-values ConfigMap.
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cnpg-backup
spec:
  schedule: "0 0 3 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: REPLACED-BY-VALUES
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
