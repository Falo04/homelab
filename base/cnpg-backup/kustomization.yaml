# Usage: docs/cnpg.md
---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - objectstore.yaml
  - scheduled-backup.yaml

replacements:
  - source:
      kind: ConfigMap
      name: cnpg-backup-values
      fieldPath: data.clusterName
    targets:
      - select:
          kind: ScheduledBackup
          name: cnpg-backup
        fieldPaths:
          - spec.cluster.name

  - source:
      kind: ConfigMap
      name: cnpg-backup-values
      fieldPath: data.destinationPath
    targets:
      - select:
          kind: ObjectStore
          name: garage-store
        fieldPaths:
          - spec.configuration.destinationPath
