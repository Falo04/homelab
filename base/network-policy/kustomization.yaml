# Usage, in the app's kustomization.yaml:
#
#   namespace: <app>
#   resources:
#     - network-policy.yaml   # extra allowed sources, if any
#   components:
#     - ../../../base/network-policy
#
# Extra allows go in the receiving namespace and match the target pod's
# labels and container ports, not its Service's.
---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - default-deny-ingress.yaml
  - allow-same-namespace.yaml
  - allow-monitoring.yaml
  - allow-cnpg-operator.yaml
