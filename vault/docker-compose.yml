services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: socket-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      socket:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - EVENTS=1
      - POST=0

  tailscale:
    image: tailscale/tailscale:v1.104.7
    container_name: tailscale
    hostname: vault
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      proxy:
      socket:
    ports:
      - "80:80"
      - "443:443"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - tailscale:/var/lib/tailscale
    secrets:
      - ts_authkey
    environment:
      - TS_HOSTNAME=vault
      - TS_AUTHKEY=file:/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ACCEPT_DNS=false

  traefik:
    image: traefik:v3.7.17
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - socket-proxy
      - tailscale
    network_mode: service:tailscale
    volumes:
      - acme:/etc/traefik/acme
      - traefik:/config
      - cloudflare:/cloudflare
    command:
      # EntryPoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.websecure.http.tls.certresolver=letsencrypt"
      # Certs
      - "--certificatesresolvers.letsencrypt.acme.email=letsencrypt@felixwallner.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/letsencrypt.json"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.delaybeforecheck=5"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=8.8.8.8:53"
      # Providers
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"
      # Observability
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--metrics.prometheus=true"
    secrets:
      - cf_token
    environment:
      - CLOUDFLARE_DNS_API_TOKEN_FILE=/run/secrets/cf_token
      - CLOUDFLARE_HTTP_TIMEOUT=${HTTP_TIMEOUT}
      - CLOUDFLARE_POLLING_INTERVAL=${POLLING_INTERVAL}
      - CLOUDFLARE_PROPAGATION_TIMEOUT=${PROPAGATION_TIMEOUT}
      - CLOUDFLARE_TTL=${TTL}

  vault:
    image: hashicorp/vault:2.2.1
    container_name: vault
    hostname: vault
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: server
    environment:
      - VAULT_ADDR=http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    networks:
      proxy:
    volumes:
      - ./vault1/config.hcl:/vault/config/config.hcl
      - ./vault1/data:/vault/data
    labels:
      # Required: exposedbydefault=false means Traefik ignores containers
      # without this label, so the router below is never created.
      - "traefik.enable=true"
      - "traefik.http.routers.vault.rule=Host(`vault.${DOMAIN}`)"
      - "traefik.http.routers.vault.entrypoints=websecure"
      - "traefik.http.routers.vault.tls=true"
      # No wildcard — per-host cert for vault.${ROOT_DOMAIN} via DNS-01.
      - "traefik.http.routers.vault.tls.certresolver=letsencrypt"
      - "traefik.http.routers.vault.middlewares=allowlist@docker"
      - "traefik.http.services.vault.loadbalancer.server.port=8200"
      - "traefik.http.middlewares.allowlist.ipallowlist.sourcerange=${ALLOWED_SOURCES}"

  vault-backup:
    image: restic/restic:0.19.1
    container_name: vault-backup
    restart: unless-stopped
    depends_on:
      - vault
    security_opt:
      - no-new-privileges:true
    networks:
      proxy:
    entrypoint: ["/bin/sh", "/usr/local/bin/vault-backup.sh"]
    volumes:
      - ./vault-backup.sh:/usr/local/bin/vault-backup.sh:ro
      - vault_backup_cache:/cache
    tmpfs:
      - /tmp:size=512m
    env_file:
      - vault-backup.env
    environment:
      - VAULT_ADDR=http://vault:8200
      - RESTIC_REPOSITORY=s3:https://s3.nas.felixwallner.com/vault-bucket/restic
      - RESTIC_CACHE_DIR=/cache
      - AWS_DEFAULT_REGION=garage
      - NTFY_URL=https://ntfy.${DOMAIN}/homelab-alerts

networks:
  proxy:
  socket:
    internal: true

volumes:
  acme:
  traefik:
  cloudflare:
  tailscale:
  vault_backup_cache:

secrets:
  cf_token:
    file: cloudflare-token.txt
  ts_authkey:
    file: tailscale-authkey.txt
