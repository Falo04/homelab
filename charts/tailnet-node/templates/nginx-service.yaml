{{- if .Values.ingress.enabled }}
{{- $ctx := dict "ctx" . "component" "nginx" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tailnet-node.fullname" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tailnet-node.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "tailnet-node.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: https
      port: 443
      targetPort: https
    - name: http
      port: 80
      targetPort: http
{{- end }}
