{{- if .Values.ingress.enabled }}
{{- $ctx := dict "ctx" . "component" "nginx" }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "tailnet-node.hostname" . }}-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tailnet-node.labels" $ctx | nindent 4 }}
spec:
  secretName: {{ include "tailnet-node.tlsSecret" . }}
  commonName: {{ include "tailnet-node.fqdn" . }}
  dnsNames:
    - {{ include "tailnet-node.fqdn" . }}
  issuerRef:
    name: {{ .Values.ingress.issuer }}
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
{{- end }}
