{{- if .Values.ingress.enabled }}
{{- $ctx := dict "ctx" . "component" "nginx" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tailnet-node.fullname" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tailnet-node.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      {{- include "tailnet-node.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tailnet-node.selectorLabels" $ctx | nindent 8 }}
      annotations:
        # Roll the pod when the server block changes; nginx only reads it at start.
        checksum/config: {{ include (print $.Template.BasePath "/nginx-configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: "{{ .Values.ingress.image.repository }}:{{ .Values.ingress.image.tag }}"
          imagePullPolicy: {{ .Values.ingress.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: https
              containerPort: 8443
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ingress.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "tailnet-node.fullname" $ctx }}-config
        - name: tls
          secret:
            secretName: {{ include "tailnet-node.tlsSecret" . }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
