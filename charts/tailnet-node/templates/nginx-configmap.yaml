{{- if .Values.ingress.enabled }}
{{- $ctx := dict "ctx" . "component" "nginx" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tailnet-node.fullname" $ctx }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tailnet-node.labels" $ctx | nindent 4 }}
data:
  00-upgrade-map.conf: |-
    map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      close;
    }
  default.conf: |-
    server {
      listen 8080;
      server_name {{ include "tailnet-node.fqdn" . }};
      return 301 https://$host$request_uri;
    }

    server {
      listen 8443 ssl;
      http2 on;
      server_name {{ include "tailnet-node.fqdn" . }};

      ssl_certificate     /etc/nginx/tls/tls.crt;
      ssl_certificate_key /etc/nginx/tls/tls.key;

      ssl_protocols TLSv1.3;
      ssl_session_cache shared:SSL:2m;
      ssl_session_timeout 1h;

      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Content-Security-Policy "frame-ancestors 'none'" always;
      add_header Referrer-Policy "same-origin" always;
      add_header X-Robots-Tag "none,noarchive,nosnippet,notranslate,noimageindex" always;
      add_header Cache-Control no-cache always;
      server_tokens off;

      client_max_body_size {{ .Values.ingress.maxBodySize }};

      location / {
        proxy_pass http://{{ .Values.ingress.backend.service }}.{{ .Release.Namespace }}.svc.cluster.local.:{{ .Values.ingress.backend.port }};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
      }
    }
{{- end }}
