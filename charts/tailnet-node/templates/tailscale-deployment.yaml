{{- $ctx := dict "ctx" . "component" "tailscale" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tailnet-node.fullname" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tailnet-node.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "tailnet-node.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tailnet-node.selectorLabels" $ctx | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tailnet-node.fullname" $ctx }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tailscale
          image: "{{ .Values.tailscale.image.repository }}:{{ .Values.tailscale.image.tag }}"
          imagePullPolicy: {{ .Values.tailscale.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: TS_HOSTNAME
              value: {{ include "tailnet-node.hostname" . | quote }}
            # Fixed, since there is one node per namespace (servers.sops.yaml);
            # renaming it would lose the node's tailnet identity.
            - name: TS_KUBE_SECRET
              value: tailscale-state
            - name: TS_USERSPACE
              value: "true"
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_SERVE_CONFIG
              value: /etc/ts-serve/serve
            - name: TS_LOGIN_SERVER
              valueFrom:
                secretKeyRef:
                  name: tailscale-servers
                  key: TS_LOGIN_SERVER
            - name: TS_LOG_TARGET
              valueFrom:
                secretKeyRef:
                  name: tailscale-servers
                  key: TS_LOG_TARGET
            - name: TS_EXTRA_ARGS
              value: "--login-server=$(TS_LOGIN_SERVER)"
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "authSecret is required: name of an existing Secret with a TS_AUTHKEY field" .Values.authSecret }}
                  key: TS_AUTHKEY
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          volumeMounts:
            - name: serve-config
              mountPath: /etc/ts-serve
              readOnly: true
          resources:
            {{- toYaml .Values.tailscale.resources | nindent 12 }}
      volumes:
        - name: serve-config
          configMap:
            name: {{ include "tailnet-node.fullname" $ctx }}-config
