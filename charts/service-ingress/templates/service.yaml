apiVersion: v1
kind: Service
metadata:
  name: {{ include "service-ingress.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service-ingress.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "service-ingress.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: 443
      targetPort: https
    - name: http
      port: 80
      targetPort: http
