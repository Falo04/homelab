apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "service-ingress.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service-ingress.labels" . | nindent 4 }}
data:
  default.conf: |-
    server {
      listen 8080;
      server_name {{ .Values.host }};
      return 301 https://$host$request_uri;
    }

    server {
      listen 8443 ssl;
      http2 on;
      server_name {{ .Values.host }};

      ssl_certificate     /etc/nginx/tls/tls.crt;
      ssl_certificate_key /etc/nginx/tls/tls.key;

      ssl_protocols TLSv1.3;
      ssl_session_cache shared:SSL:2m;
      ssl_session_timeout 1h;

      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "same-origin" always;
      add_header X-Robots-Tag "none,noarchive,nosnippet,notranslate,noimageindex" always;
      server_tokens off;

      client_max_body_size {{ .Values.maxBodySize }};

      location / {
        proxy_pass http://{{ .Values.backend.service }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.backend.port }};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        add_header Cache-Control no-cache;
        client_max_body_size 50m;
      }
    }
