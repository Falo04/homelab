# Secret scanning before every commit.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: sops-encrypted
        name: sops-encrypted
        entry: scripts/check-sops-encrypted.sh
        language: script
        files: \.sops\.yaml$
        exclude: ^\.sops\.yaml$
