apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wallos
  namespace: argocd
spec:
  project: service-apps-project
  sources:
    - repoURL: https://github.com/Falo04/homelab.git
      targetRevision: main
      path: apps/services/wallos

    - repoURL: https://github.com/Falo04/homelab.git
      targetRevision: main
      path: charts/tailnet-node
      helm:
        releaseName: wallos
        valuesObject:
          hostname: wallos
          authSecret: tailscale-auth
          ingress:
            backend:
              service: wallos
              port: 80

  destination:
    server: https://kubernetes.default.svc
    namespace: wallos
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
