apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: livesync
  namespace: argocd
spec:
  project: service-apps-project
  sources:
    - repoURL: https://github.com/Falo04/homelab.git
      targetRevision: main
      path: apps/services/livesync

    - repoURL: https://github.com/Falo04/homelab.git
      targetRevision: main
      path: charts/tailnet-node
      helm:
        releaseName: livesync
        valuesObject:
          hostname: livesync
          authSecret: tailscale-auth
          ingress:
            # Attachments sync as chunked documents, but keep headroom for large ones.
            maxBodySize: 64m
            backend:
              service: livesync
              port: 80

  destination:
    server: https://kubernetes.default.svc
    namespace: livesync
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
