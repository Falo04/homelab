apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opengym
  namespace: argocd
spec:
  project: service-apps-project
  sources:
    - repoURL: https://github.com/Falo04/homelab.git
      targetRevision: main
      path: apps/services/opengym

    - repoURL: https://github.com/Falo04/homelab.git
      targetRevision: main
      path: charts/tailnet-node
      helm:
        releaseName: opengym
        valuesObject:
          hostname: opengym
          authSecret: tailscale-auth
          ingress:
            maxBodySize: 48m
            backend:
              service: opengym
              port: 80

  destination:
    server: https://kubernetes.default.svc
    namespace: opengym
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
