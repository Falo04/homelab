apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bookorbit
  namespace: argocd
spec:
  project: service-apps-project
  sources:
    - repoURL: https://github.com/Falo04/homelab.git
      targetRevision: main
      path: apps/services/bookorbit

    - repoURL: https://github.com/Falo04/homelab.git
      targetRevision: main
      path: charts/tailnet-node
      helm:
        releaseName: bookorbit
        valuesObject:
          hostname: bookorbit
          authSecret: tailscale-auth
          ingress:
            # Book uploads; illustrated EPUBs and PDFs easily exceed the default.
            maxBodySize: 512m
            backend:
              service: bookorbit
              port: 80

  destination:
    server: https://kubernetes.default.svc
    namespace: bookorbit
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
