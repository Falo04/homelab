apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trek
  namespace: argocd
spec:
  project: service-apps-project
  sources:
    - repoURL: https://chart.liketrek.com
      chart: trek
      targetRevision: 5.1.4
      helm:
        releaseName: trek
        valuesObject:
          podSecurityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          env:
            TZ: "Europe/Berlin"
            APP_URL: "https://trek.felixwallner.com"
            ALLOWED_ORIGINS: "https://trek.felixwallner.com"
            TRUST_PROXY: "1"
            FORCE_HTTPS: "true"
            OIDC_DISPLAY_NAME: "authentik"
            OIDC_ONLY: "true"
            TREK_PLUGINS_ENABLED: "false"

          existingSecret: trek-app
          extraEnvFrom:
            - secretRef:
                name: trek-app
          persistence:
            data:
              existingClaim: trek-data
            uploads:
              existingClaim: trek-uploads

    - repoURL: https://github.com/Falo04/homelab.git
      targetRevision: main
      path: apps/services/trek

    - repoURL: https://github.com/Falo04/homelab.git
      targetRevision: main
      path: apps/services/trek/uploads-backup

  destination:
    server: https://kubernetes.default.svc
    namespace: trek
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
