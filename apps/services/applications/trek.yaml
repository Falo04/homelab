apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trek
  namespace: argocd
spec:
  project: service-apps-project
  sources:
    - repoURL: https://chart.liketrek.com
      chart: trek
      targetRevision: 5.1.2
      helm:
        releaseName: trek
        valuesObject:
          podSecurityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          env:
            TZ: "Europe/Berlin"
            APP_URL: "https://trek.int.felixwallner.com"
            ALLOWED_ORIGINS: "https://trek.int.felixwallner.com"
            TRUST_PROXY: "1"
            FORCE_HTTPS: "true"
            OIDC_DISPLAY_NAME: "authentik"
            OIDC_ONLY: "true"

          existingSecret: trek-app
          extraEnvFrom:
            - secretRef:
                name: trek-app
          persistence:
            data:
              existingClaim: trek-data
            uploads:
              existingClaim: trek-uploads

    - repoURL: https://github.com/Falo04/homelab.git
      targetRevision: main
      path: apps/services/trek

    - repoURL: https://github.com/Falo04/homelab.git
      targetRevision: main
      path: apps/services/trek/uploads-backup

    - repoURL: https://github.com/Falo04/homelab.git
      targetRevision: main
      path: charts/tailscale-node
      helm:
        releaseName: trek-tailscale
        valuesObject:
          pod:
            fullnameOverride: tailscale
          tailscale:
            hostname: trek
            tcpForward:
              - port: 443
                targetPort: 443
                service: trek-ingress
              - port: 80
                targetPort: 80
                service: trek-ingress
          vault:
            authRef: vault-k8s
            mount: k3s-services
            path: trek/tailscale

    - repoURL: https://github.com/Falo04/homelab.git
      targetRevision: main
      path: charts/service-ingress
      helm:
        releaseName: trek-ingress
        valuesObject:
          pod:
            fullnameOverride: trek-ingress
          host: trek.int.felixwallner.com
          tlsSecret: trek-tls
          maxBodySize: 64m
          backend:
            service: trek
            port: 3000

  destination:
    server: https://kubernetes.default.svc
    namespace: trek
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
