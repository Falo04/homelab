apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: stalwart-ingress
  namespace: stalwart
spec:
  entryPoints:
    - tailscale
  tls:
    secretName: stalwart-tls
  routes:
    - match: Host(`stalwart.int.felixwallner.com`)
      kind: Rule
      services:
        - name: stalwart-service
          # Stalwart serves /admin and JMAP on its HTTP listener, 8080 by
          # default. Traefik terminates TLS, so target the plain port.
          port: 8080
