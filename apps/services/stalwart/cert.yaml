apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: stalwart-cert
  namespace: stalwart
spec:
  secretName: stalwart-tls
  commonName: stalwart.int.felixwallner.com
  dnsNames:
    - stalwart.int.felixwallner.com
  issuerRef:
    name: letsencrypt-dns
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
