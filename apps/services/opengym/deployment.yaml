apiVersion: apps/v1
kind: Deployment
metadata:
  name: opengym
  namespace: opengym
  labels:
    app.kubernetes.io/name: opengym
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opengym
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opengym
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/duartesantos8/opengym-api:1.4.3
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: PORT
              value: "3000"
            - name: DATA_DIR
              value: /data
            - name: RP_ID
              value: gym.int.felixwallner.com
            - name: ORIGIN
              value: https://gym.int.felixwallner.com
            - name: FIRST_USER_ADMIN
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

        - name: web
          image: ghcr.io/duartesantos8/opengym-web:1.4.3
          ports:
            - name: web
              containerPort: 8080
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: NGINX_PORT
              value: "8080"
            - name: BACKEND
              value: 127.0.0.1
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opengym-data
