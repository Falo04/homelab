apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: opengym

resources:
  - namespace.yaml
  - tailscale-secret.sops.yaml
  - pvc-backup-secret.sops.yaml
  - pvc-backup-values.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - opengym-cert.yaml

components:
  - ../../../base/pvc-backup
  - ../../../base/network-policy

# opengym writes its data files 0600 as uid 1000, so the backup job (65534 by
# default) must run as the same user to read them.
patches:
  # The pvc-backup component still brings a VaultStaticSecret for the apps that
  # haven't moved off Vault yet. Here pvc-backup-s3 comes from
  # pvc-backup-secret.sops.yaml instead.
  - patch: |-
      $patch: delete
      apiVersion: secrets.hashicorp.com/v1beta1
      kind: VaultStaticSecret
      metadata:
        name: vault-pvc-backup
  - target:
      kind: CronJob
      name: pvc-backup
    patch: |
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/securityContext/runAsUser
        value: 1000
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/securityContext/runAsGroup
        value: 1000
