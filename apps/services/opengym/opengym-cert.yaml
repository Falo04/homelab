apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: opengym-cert
  namespace: opengym
spec:
  secretName: opengym-tls
  commonName: gym.int.felixwallner.com
  dnsNames:
    - gym.int.felixwallner.com
  issuerRef:
    name: letsencrypt-dns
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
