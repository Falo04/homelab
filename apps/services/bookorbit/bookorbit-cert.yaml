apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bookorbit-cert
  namespace: bookorbit
spec:
  secretName: bookorbit-tls
  commonName: books.int.felixwallner.com
  dnsNames:
    - books.int.felixwallner.com
  issuerRef:
    name: letsencrypt-dns
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
