# BookOrbit application secrets.
#
# keys (generate each with `openssl rand -hex 32`):
# - `JWT_SECRET`
# - `PODCAST_ENCRYPTION_KEY`
# - `SETUP_BOOTSTRAP_TOKEN`
# - `EMAIL_ENCRYPTION_KEY`
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-bookorbit-app
  namespace: bookorbit
spec:
  vaultAuthRef: vault-k8s
  mount: k3s-services
  type: kv-v2
  path: bookorbit/app
  refreshAfter: 1h
  # Read from the environment at startup only.
  rolloutRestartTargets:
    - kind: Deployment
      name: bookorbit
  destination:
    create: true
    name: bookorbit-app
    labels:
      app.kubernetes.io/part-of: bookorbit
