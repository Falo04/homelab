apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookorbit
  namespace: bookorbit
  labels:
    app.kubernetes.io/name: bookorbit
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bookorbit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookorbit
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-volume
          image: busybox:1.38.0
          command:
            - /bin/sh
            - -ceu
            - |
              mkdir -p /volume/app /volume/books
              chown 1000:1000 /volume/app /volume/books
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - name: data
              mountPath: /volume
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: bookorbit
          image: ghcr.io/bookorbit/bookorbit:3.3.0
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: TZ
              value: "Europe/Berlin"
            - name: APP_URL
              value: "https://books.int.felixwallner.com"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bookorbit-postgres-app
                  key: uri
            - name: LIBRARY_BROWSE_ROOT
              value: "/books"
            - name: OIDC_ALLOW_LOCAL_ISSUERS
              value: "true"
          envFrom:
            - secretRef:
                name: bookorbit-app
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: app
            - name: data
              mountPath: /books
              subPath: books
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1536Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bookorbit-data
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
