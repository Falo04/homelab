apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: trek-cert
  namespace: trek
spec:
  secretName: trek-tls
  commonName: trek.int.felixwallner.com
  dnsNames:
    - trek.int.felixwallner.com
  issuerRef:
    name: letsencrypt-dns
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
