apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: trek

resources:
  - namespace.yaml
  - app-secret.sops.yaml
  - pvc-backup-secret.sops.yaml
  - pvc-backup-values.yaml
  - pvc.yaml
  - network-policy.yaml

components:
  - ../../../base/pvc-backup
  - ../../../base/network-policy

# trek-uploads is backed up by ./uploads-backup, its own Argo source.
patches:
  # The pvc-backup component still brings a VaultStaticSecret for the apps that
  # haven't moved off Vault yet. Here pvc-backup-s3 comes from
  # pvc-backup-secret.sops.yaml instead.
  - patch: |-
      $patch: delete
      apiVersion: secrets.hashicorp.com/v1beta1
      kind: VaultStaticSecret
      metadata:
        name: vault-pvc-backup
  - target:
      kind: CronJob
    patch: |
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/securityContext/runAsUser
        value: 1000
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/securityContext/runAsGroup
        value: 1000
