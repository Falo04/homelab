# TREK application secrets and OIDC settings.
#
# keys:
# - `ENCRYPTION_KEY`      `openssl rand -hex 32`; encrypts stored secrets at rest
# - `OIDC_ISSUER`         https://sso.felixwallner.com/application/o/trek/
# - `OIDC_DISCOVERY_URL`  <issuer>.well-known/openid-configuration
# - `OIDC_CLIENT_ID`
# - `OIDC_CLIENT_SECRET`
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-trek-app
  namespace: trek
spec:
  vaultAuthRef: vault-k8s
  mount: k3s-services
  type: kv-v2
  path: trek/app
  refreshAfter: 1h
  # Read from the environment at startup only.
  rolloutRestartTargets:
    - kind: Deployment
      name: trek
  destination:
    create: true
    name: trek-app
    labels:
      app.kubernetes.io/part-of: trek
