apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: livesync-cert
  namespace: livesync
spec:
  secretName: livesync-tls
  commonName: livesync.int.felixwallner.com
  dnsNames:
    - livesync.int.felixwallner.com
  issuerRef:
    name: letsencrypt-dns
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
