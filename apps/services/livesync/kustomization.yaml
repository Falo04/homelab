apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: livesync

resources:
  - namespace.yaml
  - auth-secret.sops.yaml
  - tailscale-secret.sops.yaml
  - pvc-backup-secret.sops.yaml
  - pvc-backup-values.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - livesync-cert.yaml

components:
  - ../../../base/pvc-backup
  - ../../../base/network-policy

patches:
  # The pvc-backup component still brings a VaultStaticSecret for the apps that
  # haven't moved off Vault yet. Here pvc-backup-s3 comes from
  # pvc-backup-secret.sops.yaml instead.
  - patch: |-
      $patch: delete
      apiVersion: secrets.hashicorp.com/v1beta1
      kind: VaultStaticSecret
      metadata:
        name: vault-pvc-backup

configMapGenerator:
  - name: livesync-config
    namespace: livesync
    files:
      - local.ini
