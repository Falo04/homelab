apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: livesync

resources:
  - namespace.yaml
  - auth-secret.sops.yaml
  - tailscale-secret.sops.yaml
  - pvc-backup-secret.sops.yaml
  - pvc-backup-values.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml

components:
  - ../../../base/pvc-backup
  - ../../../base/network-policy

configMapGenerator:
  - name: livesync-config
    namespace: livesync
    files:
      - local.ini
