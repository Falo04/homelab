# CouchDB admin, which is also the account the LiveSync plugin logs in with.
#
# keys:
# - `COUCHDB_USER`
# - `COUCHDB_PASSWORD`
# - `COUCHDB_SECRET`    cookie-auth signing secret, any random string
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-livesync-auth
  namespace: livesync
spec:
  vaultAuthRef: vault-k8s
  mount: k3s-services
  type: kv-v2
  path: livesync/auth
  refreshAfter: 1h
  # The entrypoint writes the admin into the config at startup, so restart
  # CouchDB when it changes.
  rolloutRestartTargets:
    - kind: Deployment
      name: livesync
  destination:
    create: true
    name: livesync-auth
    labels:
      app.kubernetes.io/part-of: livesync
