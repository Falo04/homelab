apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wallos-cert
  namespace: wallos
spec:
  secretName: wallos-tls
  commonName: wallos.int.felixwallner.com
  dnsNames:
    - wallos.int.felixwallner.com
  issuerRef:
    name: letsencrypt-dns
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
