# Declarative wallos oidc settings.
#
# keys:
# - `OIDC_PROVIDER_NAME`  label on the login button
# - `OIDC_CLIENT_ID`
# - `OIDC_CLIENT_SECRET`
# - `OIDC_ISSUER`
# - `OIDC_REDIRECT_URL`
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-wallos-auth
  namespace: wallos
spec:
  vaultAuthRef: vault-k8s
  mount: k3s-services
  type: kv-v2
  path: wallos/auth
  refreshAfter: 1h
  # wallos only reads its OIDC settings at startup, so restart it when they change.
  rolloutRestartTargets:
    - kind: Deployment
      name: wallos
  destination:
    create: true
    name: wallos-auth
    labels:
      app.kubernetes.io/part-of: wallos
