apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sops-secrets-operator
  namespace: argocd
spec:
  project: infra-apps-project
  sources:
    - repoURL: https://isindir.github.io/sops-secrets-operator/
      chart: sops-secrets-operator
      targetRevision: 0.30.2
      helm:
        releaseName: sops-secrets-operator
        valuesObject:
          fullnameOverride: sops-secrets-operator

          image:
            repository: quay.io/isindir/sops-secrets-operator
            tag: "0.22.5@sha256:be448be435e233d5fbd5e42b18c789065693be760d78cb72e793bb78650f1f97"
            pullPolicy: IfNotPresent

          secretsAsFiles:
            - name: sops-age-key
              mountPath: /etc/sops-age-key
              secretName: sops-age-key
          extraEnv:
            - name: SOPS_AGE_KEY_FILE
              value: /etc/sops-age-key/keys.txt

          defaultEnforceOwnership: true

          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi

          securityContext:
            enabled: true
            customPodSecurityContext:
              runAsNonRoot: true
              runAsUser: 13001
              runAsGroup: 13001
              seccompProfile:
                type: RuntimeDefault
            container:
              enabled: true
              customContainerSecurityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL

    - repoURL: https://github.com/Falo04/homelab.git
      targetRevision: main
      path: apps/infra/sops-secrets-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: sops-secrets-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
