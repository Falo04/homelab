apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: infra-apps-project
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: grafana
      targetRevision: 10.5.15
      helm:
        releaseName: grafana
        values: |
          fullnameOverride: grafana

          persistence:
            enabled: false

          ingress:
            enabled: false

          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password

          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              folderAnnotation: grafana_folder
              provider:
                foldersFromFilesStructure: true

          env:
            GF_DATABASE_TYPE: postgres
            GF_DATABASE_HOST: grafana-postgres-rw:5432
            GF_DATABASE_SSL_MODE: require

          envValueFrom:
            GF_DATABASE_NAME:
              secretKeyRef:
                name: grafana-postgres-app
                key: dbname
            GF_DATABASE_USER:
              secretKeyRef:
                name: grafana-postgres-app
                key: username
            GF_DATABASE_PASSWORD:
              secretKeyRef:
                name: grafana-postgres-app
                key: password
            # Kept out of grafana.ini so they never land in the ConfigMap.
            GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
              secretKeyRef:
                name: grafana-oidc
                key: clientID
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                name: grafana-oidc
                key: clientSecret
            NTFY_TOKEN:
              secretKeyRef:
                name: grafana-ntfy
                key: token

          datasources:
            datasources.yaml:
              apiVersion: 1
              datasources:
                - name: Prometheus
                  type: prometheus
                  uid: prometheus
                  access: proxy
                  url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
                  isDefault: true
                  jsonData:
                    timeInterval: 30s
                    httpMethod: POST
                # Shows Prometheus/Alertmanager alerts and silences in Grafana's alerting UI.
                - name: Alertmanager
                  type: alertmanager
                  uid: alertmanager
                  access: proxy
                  url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
                  jsonData:
                    implementation: prometheus
                    handleGrafanaManagedAlerts: false
                - name: Loki
                  type: loki
                  uid: loki
                  access: proxy
                  url: http://loki.loki.svc.cluster.local:3100

          alerting:
            contactpoints.yaml:
              apiVersion: 1
              contactPoints:
                - orgId: 1
                  name: ntfy
                  receivers:
                    - uid: ntfy
                      type: webhook
                      settings:
                        url: http://ntfy.ntfy.svc.cluster.local/homelab-alerts?template=grafana
                        httpMethod: POST
                        authorization_scheme: Bearer
                        authorization_credentials: $__env{NTFY_TOKEN}
            policies.yaml:
              apiVersion: 1
              policies:
                - orgId: 1
                  receiver: ntfy
                  group_by: [grafana_folder, alertname]

          grafana.ini:
            server:
              root_url: https://grafana.int.felixwallner.com
            analytics:
              check_for_updates: false
              reporting_enabled: false
            auth:
              disable_login_form: false
              oauth_auto_login: false
            auth.anonymous:
              enabled: false
            auth.generic_oauth:
              enabled: true
              name: authentik
              icon: signin
              allow_sign_up: true
              scopes: openid profile email
              auth_url: https://sso.int.felixwallner.com/application/o/authorize/
              token_url: https://sso.int.felixwallner.com/application/o/token/
              api_url: https://sso.int.felixwallner.com/application/o/userinfo/
              signout_redirect_url: https://sso.int.felixwallner.com/application/o/grafana/end-session/
              use_pkce: true
              use_refresh_token: true
              # authentik sends the `groups` claim; anything unmatched gets Viewer.
              role_attribute_path: contains(groups[*], 'admins') && 'Admin' || contains(groups[*], 'editors') && 'Editor' || 'Viewer'
              role_attribute_strict: false
              allow_assign_grafana_admin: true

    - repoURL: https://github.com/Falo04/homelab.git
      targetRevision: main
      path: apps/infra/grafana
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
