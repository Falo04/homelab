apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: infra-apps-project
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 7.3.0
      helm:
        releaseName: loki
        values: |
          fullnameOverride: loki

          deploymentMode: SingleBinary

          loki:
            auth_enabled: false

            commonConfig:
              replication_factor: 1

            schemaConfig:
              configs:
                - from: "2024-04-01"
                  store: tsdb
                  object_store: s3
                  schema: v13
                  index:
                    prefix: index_
                    period: 24h

            storage:
              type: s3
              bucketNames:
                chunks: loki-bucket
                ruler: loki-bucket
                admin: loki-bucket
              s3:
                endpoint: https://s3.nas.felixwallner.com
                region: garage
                s3ForcePathStyle: true
                accessKeyId: ${ACCESS_KEY_ID}
                secretAccessKey: ${ACCESS_SECRET_KEY}

            limits_config:
              retention_period: 720h

            querier:
              max_concurrent: 2

            compactor:
              retention_enabled: true
              delete_request_store: s3

          singleBinary:
            replicas: 1
            extraArgs:
              - -config.expand-env=true
            extraEnvFrom:
              - secretRef:
                  name: loki-s3
            extraEnv:
              - name: GOMEMLIMIT
                value: 1750MiB
            persistence:
              enabled: true
              size: 10Gi
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 2Gi

          write:
            replicas: 0
          read:
            replicas: 0
          backend:
            replicas: 0
          chunksCache:
            enabled: false
          resultsCache:
            enabled: false
          gateway:
            enabled: false
          lokiCanary:
            enabled: false
          test:
            enabled: false

          sidecar:
            rules:
              enabled: false

          monitoring:
            serviceMonitor:
              enabled: true

    - repoURL: https://github.com/Falo04/homelab.git
      targetRevision: main
      path: apps/infra/loki
  destination:
    server: https://kubernetes.default.svc
    namespace: loki
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
