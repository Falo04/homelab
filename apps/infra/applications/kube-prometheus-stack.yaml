apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: infra-apps-project
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 90.0.0
      helm:
        releaseName: kube-prometheus-stack
        values: |
          grafana:
            enabled: false

          kubeControllerManager:
            enabled: false
          kubeScheduler:
            enabled: false
          kubeProxy:
            enabled: false
          kubeEtcd:
            enabled: false

          defaultRules:
            rules:
              kubeControllerManager: false
              kubeSchedulerAlerting: false
              kubeSchedulerRecording: false
              kubeProxy: false
              etcd: false
              kubernetesSystem: false
              windows: false

          prometheus:
            prometheusSpec:
              retention: 15d
              retentionSize: 15GiB
              serviceMonitorSelectorNilUsesHelmValues: false
              podMonitorSelectorNilUsesHelmValues: false
              ruleSelectorNilUsesHelmValues: false
              probeSelectorNilUsesHelmValues: false
              scrapeConfigSelectorNilUsesHelmValues: false
              storageSpec:
                volumeClaimTemplate:
                  spec:
                    accessModes:
                      - ReadWriteOnce
                    resources:
                      requests:
                        storage: 20Gi

          alertmanager:
            config:
              route:
                receiver: ntfy
                group_by: [alertname, namespace]
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 12h
                routes:
                  - receiver: "null"
                    matchers:
                      - alertname =~ "InfoInhibitor|Watchdog"
              receivers:
                - name: "null"
                - name: ntfy
                  webhook_configs:
                    - url: http://ntfy.ntfy.svc.cluster.local/homelab-alerts?template=alertmanager
                      send_resolved: true
                      http_config:
                        authorization:
                          type: Bearer
                          credentials_file: /etc/alertmanager/secrets/alertmanager-ntfy/token

            alertmanagerSpec:
              # Mounted at /etc/alertmanager/secrets/<name>/<key>.
              secrets:
                - alertmanager-ntfy
              storage:
                volumeClaimTemplate:
                  spec:
                    accessModes:
                      - ReadWriteOnce
                    resources:
                      requests:
                        storage: 2Gi

    - repoURL: https://github.com/Falo04/homelab.git
      targetRevision: main
      path: apps/infra/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
