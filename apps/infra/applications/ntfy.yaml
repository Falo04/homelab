apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ntfy
  namespace: argocd
spec:
  project: infra-apps-project
  sources:
    - repoURL: https://github.com/Falo04/homelab.git
      targetRevision: main
      path: apps/infra/ntfy

    - repoURL: https://github.com/Falo04/homelab.git
      targetRevision: main
      path: charts/tailnet-node
      helm:
        releaseName: ntfy
        valuesObject:
          hostname: ntfy
          authSecret: tailscale-auth
          ingress:
            backend:
              service: ntfy
              port: 80

  destination:
    server: https://kubernetes.default.svc
    namespace: ntfy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
