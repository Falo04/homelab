apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: infra-apps-project
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.13.0
      helm:
        releaseName: alloy
        values: |
          crds:
            create: false

          alloy:
            extraEnv:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName

            configMap:
              content: |
                discovery.kubernetes "pods" {
                  role = "pod"

                  selectors {
                    role  = "pod"
                    field = "spec.nodeName=" + sys.env("NODE_NAME")
                  }
                }

                discovery.relabel "pods" {
                  targets = discovery.kubernetes.pods.targets

                  rule {
                    source_labels = ["__meta_kubernetes_namespace"]
                    target_label  = "namespace"
                  }
                  rule {
                    source_labels = ["__meta_kubernetes_pod_name"]
                    target_label  = "pod"
                  }
                  rule {
                    source_labels = ["__meta_kubernetes_pod_container_name"]
                    target_label  = "container"
                  }
                  rule {
                    source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                    target_label  = "app"
                  }
                }

                loki.source.kubernetes "pods" {
                  targets    = discovery.relabel.pods.output
                  forward_to = [loki.write.default.receiver]
                }

                loki.write "default" {
                  endpoint {
                    url = "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
                  }
                }

                otelcol.receiver.otlp "default" {
                  grpc {
                    endpoint = "0.0.0.0:4317"
                  }
                  http {
                    endpoint = "0.0.0.0:4318"
                  }

                  output {
                    traces  = [otelcol.processor.batch.default.input]
                    metrics = [otelcol.processor.batch.default.input]
                    logs    = [otelcol.processor.batch.default.input]
                  }
                }

                otelcol.processor.batch "default" {
                  output {
                    traces  = [otelcol.exporter.otlp.tempo.input]
                    metrics = [otelcol.exporter.prometheus.default.input]
                    logs    = [otelcol.exporter.otlphttp.loki.input]
                  }
                }

                otelcol.exporter.otlp "tempo" {
                  client {
                    endpoint = "tempo.tempo.svc.cluster.local:4317"
                    tls {
                      insecure = true
                    }
                  }
                }

                otelcol.exporter.prometheus "default" {
                  forward_to = [prometheus.remote_write.default.receiver]
                }

                prometheus.remote_write "default" {
                  endpoint {
                    url = "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
                  }
                }

                // Loki's native OTLP endpoint keeps resource attributes as structured metadata.
                otelcol.exporter.otlphttp "loki" {
                  client {
                    endpoint = "http://loki.loki.svc.cluster.local:3100/otlp"
                  }
                }

            extraPorts:
              - name: otlp-grpc
                port: 4317
                targetPort: 4317
                protocol: TCP
                appProtocol: grpc
              - name: otlp-http
                port: 4318
                targetPort: 4318
                protocol: TCP

            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 512Mi

          controller:
            type: daemonset

          serviceMonitor:
            enabled: true

    - repoURL: https://github.com/Falo04/homelab.git
      targetRevision: main
      path: apps/infra/alloy

    - repoURL: https://github.com/Falo04/homelab.git
      targetRevision: main
      path: charts/tailscale-node
      helm:
        releaseName: otel-tailscale
        valuesObject:
          tailscale:
            hostname: otel
            tcpForward:
              - port: 4317
                service: alloy
              - port: 4318
                service: alloy
          vault:
            authRef: vault-k8s
            mount: k3s-infra
            path: alloy/tailscale
  destination:
    server: https://kubernetes.default.svc
    namespace: alloy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
