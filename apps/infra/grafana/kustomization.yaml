apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - vault-auth.yaml
  - oidc-secret.yaml
  - admin-secret.yaml
  - postgres.yaml
  - grafana-cert.yaml
  - grafana-ingress.yaml

configMapGenerator:
  - name: grafana-dashboard-fronius
    files:
      - dashboards/photovoltaik.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "Infra"

  - name: grafana-dashboard-k8s
    files:
      - dashboards/k8s-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "Infra"

  - name: grafana-dashboard-cnpg
    files:
      - dashboards/cnpg.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "Infra"

generatorOptions:
  disableNameSuffixHash: true
