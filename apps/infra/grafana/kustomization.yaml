apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - oidc-secret.sops.yaml
  - admin-secret.sops.yaml
  - ntfy-secret.sops.yaml
  - tailscale-secret.sops.yaml
  - postgres.yaml

components:
  - ../../../base/network-policy

configMapGenerator:
  - name: grafana-dashboard-k8s
    files:
      - dashboards/k8s-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "Infra"

  - name: grafana-dashboard-cnpg
    files:
      - dashboards/cnpg.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "Infra"

  - name: grafana-dashboard-ntfy
    files:
      - dashboards/ntfy.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "Infra"

generatorOptions:
  disableNameSuffixHash: true
