# Break-glass local admin, used when authentik is unavailable.
# keys: `admin-user` / `admin-password`
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-grafana-admin
  namespace: grafana
spec:
  vaultAuthRef: vault-k8s
  mount: k3s-infra
  type: kv-v2
  path: grafana/admin
  refreshAfter: 1h
  destination:
    create: true
    name: grafana-admin
    labels:
      app.kubernetes.io/part-of: grafana
