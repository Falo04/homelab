# Credentials for the authentik OAuth2 provider.
# keys: `clientID` / `clientSecret`
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-grafana-oidc
  namespace: grafana
spec:
  vaultAuthRef: vault-k8s
  mount: k3s-infra
  type: kv-v2
  path: grafana/oidc
  refreshAfter: 1h
  destination:
    create: true
    name: grafana-oidc
    labels:
      app.kubernetes.io/part-of: grafana
