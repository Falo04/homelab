apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-fronius
  namespace: grafana
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Infra"
data:
  photovoltaik.json: |
    {
      "uid": "pv-fronius",
      "title": "Photovoltaik",
      "tags": ["solar", "fronius"],
      "timezone": "browser",
      "schemaVersion": 39,
      "editable": true,
      "refresh": "30s",
      "time": { "from": "now-2d", "to": "now" },
      "templating":
        {
          "list":
            [
              {
                "name": "arbeitspreis",
                "label": "Arbeitspreis EUR/kWh",
                "type": "textbox",
                "query": "0.32",
                "current": { "text": "0.32", "value": "0.32" },
              },
              {
                "name": "verguetung",
                "label": "Einspeiseverguetung EUR/kWh",
                "type": "textbox",
                "query": "0.08",
                "current": { "text": "0.08", "value": "0.08" },
              },
            ],
        },
      "panels":
        [
          {
            "type": "row",
            "title": "Jetzt",
            "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
            "collapsed": false,
            "panels": [],
          },
          {
            "id": 1,
            "type": "stat",
            "title": "PV-Erzeugung",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "gridPos": { "h": 5, "w": 4, "x": 0, "y": 1 },
            "targets":
              [
                {
                  "refId": "A",
                  "expr": "fronius_site_power_photovoltaic",
                  "instant": true,
                },
              ],
            "options":
              {
                "colorMode": "background",
                "graphMode": "area",
                "reduceOptions": { "calcs": ["lastNotNull"] },
              },
            "fieldConfig":
              {
                "defaults":
                  {
                    "unit": "watt",
                    "decimals": 0,
                    "color": { "mode": "fixed", "fixedColor": "orange" },
                  },
                "overrides": [],
              },
          },
          {
            "id": 2,
            "type": "stat",
            "title": "Hausverbrauch",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "gridPos": { "h": 5, "w": 4, "x": 4, "y": 1 },
            "targets":
              [
                {
                  "refId": "A",
                  "expr": "fronius:house_load_watts",
                  "instant": true,
                },
              ],
            "options":
              {
                "colorMode": "background",
                "graphMode": "area",
                "reduceOptions": { "calcs": ["lastNotNull"] },
              },
            "fieldConfig":
              {
                "defaults":
                  {
                    "unit": "watt",
                    "decimals": 0,
                    "color": { "mode": "fixed", "fixedColor": "blue" },
                  },
                "overrides": [],
              },
          },
          {
            "id": 3,
            "type": "stat",
            "title": "Netz",
            "description": "Positiv = Bezug aus dem Netz, negativ = Einspeisung.",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "gridPos": { "h": 5, "w": 4, "x": 8, "y": 1 },
            "targets":
              [
                {
                  "refId": "A",
                  "expr": "fronius_site_power_grid",
                  "instant": true,
                },
              ],
            "options":
              {
                "colorMode": "background",
                "graphMode": "area",
                "reduceOptions": { "calcs": ["lastNotNull"] },
              },
            "fieldConfig":
              {
                "defaults":
                  {
                    "unit": "watt",
                    "decimals": 0,
                    "color": { "mode": "thresholds" },
                    "thresholds":
                      {
                        "mode": "absolute",
                        "steps":
                          [
                            { "color": "green", "value": null },
                            { "color": "red", "value": 0 },
                          ],
                      },
                  },
                "overrides": [],
              },
          },
          {
            "id": 4,
            "type": "stat",
            "title": "Batterie",
            "description": "Ladestand. Ohne Speicher bleibt das Panel leer.",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "gridPos": { "h": 5, "w": 4, "x": 12, "y": 1 },
            "targets":
              [{ "refId": "A", "expr": "fronius_inverter_soc", "instant": true }],
            "options":
              {
                "colorMode": "background",
                "graphMode": "area",
                "reduceOptions": { "calcs": ["lastNotNull"] },
              },
            "fieldConfig":
              {
                "defaults":
                  {
                    "unit": "percent",
                    "min": 0,
                    "max": 100,
                    "decimals": 0,
                    "color": { "mode": "thresholds" },
                    "thresholds":
                      {
                        "mode": "absolute",
                        "steps":
                          [
                            { "color": "red", "value": null },
                            { "color": "orange", "value": 25 },
                            { "color": "green", "value": 60 },
                          ],
                      },
                  },
                "overrides": [],
              },
          },
          {
            "id": 5,
            "type": "gauge",
            "title": "Autarkie",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "gridPos": { "h": 5, "w": 4, "x": 16, "y": 1 },
            "targets":
              [
                {
                  "refId": "A",
                  "expr": "fronius_site_autonomy_ratio",
                  "instant": true,
                },
              ],
            "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
            "fieldConfig":
              {
                "defaults":
                  {
                    "unit": "percent",
                    "min": 0,
                    "max": 100,
                    "decimals": 0,
                    "thresholds":
                      {
                        "mode": "absolute",
                        "steps":
                          [
                            { "color": "red", "value": null },
                            { "color": "orange", "value": 40 },
                            { "color": "green", "value": 75 },
                          ],
                      },
                  },
                "overrides": [],
              },
          },
          {
            "id": 6,
            "type": "gauge",
            "title": "Eigenverbrauch",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "gridPos": { "h": 5, "w": 4, "x": 20, "y": 1 },
            "targets":
              [
                {
                  "refId": "A",
                  "expr": "fronius_site_selfconsumption_ratio",
                  "instant": true,
                },
              ],
            "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
            "fieldConfig":
              {
                "defaults":
                  {
                    "unit": "percent",
                    "min": 0,
                    "max": 100,
                    "decimals": 0,
                    "thresholds":
                      {
                        "mode": "absolute",
                        "steps":
                          [
                            { "color": "orange", "value": null },
                            { "color": "green", "value": 60 },
                          ],
                      },
                  },
                "overrides": [],
              },
          },
          {
            "type": "row",
            "title": "Leistung",
            "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 },
            "collapsed": false,
            "panels": [],
          },
          {
            "id": 10,
            "type": "timeseries",
            "title": "Leistungsverlauf",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "gridPos": { "h": 10, "w": 24, "x": 0, "y": 7 },
            "targets":
              [
                {
                  "refId": "A",
                  "expr": "fronius_site_power_photovoltaic",
                  "legendFormat": "PV-Erzeugung",
                },
                {
                  "refId": "B",
                  "expr": "fronius:house_load_watts",
                  "legendFormat": "Hausverbrauch",
                },
                {
                  "refId": "C",
                  "expr": "fronius:grid_import_watts",
                  "legendFormat": "Netzbezug",
                },
                {
                  "refId": "D",
                  "expr": "fronius:grid_export_watts",
                  "legendFormat": "Einspeisung",
                },
                {
                  "refId": "E",
                  "expr": "fronius_site_power_accu",
                  "legendFormat": "Batterie",
                },
              ],
            "options":
              {
                "legend":
                  {
                    "displayMode": "table",
                    "placement": "right",
                    "calcs": ["lastNotNull", "max", "mean"],
                  },
                "tooltip": { "mode": "multi", "sort": "desc" },
              },
            "fieldConfig":
              {
                "defaults":
                  {
                    "unit": "watt",
                    "decimals": 0,
                    "custom":
                      {
                        "drawStyle": "line",
                        "lineWidth": 1,
                        "fillOpacity": 15,
                        "showPoints": "never",
                        "spanNulls": 120000,
                      },
                  },
                "overrides":
                  [
                    {
                      "matcher": { "id": "byName", "options": "PV-Erzeugung" },
                      "properties":
                        [
                          {
                            "id": "color",
                            "value": { "mode": "fixed", "fixedColor": "orange" },
                          },
                        ],
                    },
                    {
                      "matcher": { "id": "byName", "options": "Hausverbrauch" },
                      "properties":
                        [
                          {
                            "id": "color",
                            "value": { "mode": "fixed", "fixedColor": "blue" },
                          },
                        ],
                    },
                    {
                      "matcher": { "id": "byName", "options": "Netzbezug" },
                      "properties":
                        [
                          {
                            "id": "color",
                            "value": { "mode": "fixed", "fixedColor": "red" },
                          },
                        ],
                    },
                    {
                      "matcher": { "id": "byName", "options": "Einspeisung" },
                      "properties":
                        [
                          {
                            "id": "color",
                            "value": { "mode": "fixed", "fixedColor": "green" },
                          },
                        ],
                    },
                    {
                      "matcher": { "id": "byName", "options": "Batterie" },
                      "properties":
                        [
                          {
                            "id": "color",
                            "value": { "mode": "fixed", "fixedColor": "purple" },
                          },
                        ],
                    },
                  ],
              },
          },
          {
            "type": "row",
            "title": "Energie",
            "gridPos": { "h": 1, "w": 24, "x": 0, "y": 17 },
            "collapsed": false,
            "panels": [],
          },
          {
            "id": 20,
            "type": "stat",
            "title": "Bilanz im gewaehlten Zeitraum",
            "description": "Leistung ueber den Zeitraum integriert, in kWh.",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "gridPos": { "h": 5, "w": 24, "x": 0, "y": 18 },
            "targets":
              [
                {
                  "refId": "A",
                  "expr": "sum_over_time(fronius_site_power_photovoltaic[$__range:1m]) / 60 / 1000",
                  "legendFormat": "Erzeugung",
                  "instant": true,
                },
                {
                  "refId": "B",
                  "expr": "sum_over_time(fronius:house_load_watts[$__range:1m]) / 60 / 1000",
                  "legendFormat": "Verbrauch",
                  "instant": true,
                },
                {
                  "refId": "C",
                  "expr": "sum_over_time(fronius:grid_import_watts[$__range:1m]) / 60 / 1000",
                  "legendFormat": "Netzbezug",
                  "instant": true,
                },
                {
                  "refId": "D",
                  "expr": "sum_over_time(fronius:grid_export_watts[$__range:1m]) / 60 / 1000",
                  "legendFormat": "Einspeisung",
                  "instant": true,
                },
                {
                  "refId": "E",
                  "expr": "sum_over_time(fronius:self_consumption_watts[$__range:1m]) / 60 / 1000",
                  "legendFormat": "Eigenverbrauch",
                  "instant": true,
                },
              ],
            "options":
              {
                "colorMode": "value",
                "graphMode": "none",
                "textMode": "value_and_name",
                "reduceOptions": { "calcs": ["lastNotNull"] },
              },
            "fieldConfig":
              { "defaults": { "unit": "kwatth", "decimals": 1 }, "overrides": [] },
          },
          {
            "id": 21,
            "type": "barchart",
            "title": "Erzeugung pro Tag",
            "description": "Zaehlerstand-Differenz je Balken. Panel-Intervall steuert die Balkenbreite.",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "gridPos": { "h": 9, "w": 12, "x": 0, "y": 23 },
            "interval": "1d",
            "targets":
              [
                {
                  "refId": "A",
                  "expr": "(max_over_time(fronius_site_realtime_data_total_energy_generated[$__interval]) - min_over_time(fronius_site_realtime_data_total_energy_generated[$__interval])) / 1000",
                  "legendFormat": "Erzeugung",
                },
              ],
            "options":
              {
                "legend": { "displayMode": "list", "placement": "bottom" },
                "xTickLabelRotation": -45,
              },
            "fieldConfig":
              {
                "defaults":
                  {
                    "unit": "kwatth",
                    "decimals": 1,
                    "color": { "mode": "fixed", "fixedColor": "orange" },
                    "custom": { "fillOpacity": 80, "lineWidth": 0 },
                  },
                "overrides": [],
              },
          },
          {
            "id": 22,
            "type": "barchart",
            "title": "Netzbezug und Einspeisung pro Tag",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "gridPos": { "h": 9, "w": 12, "x": 12, "y": 23 },
            "interval": "1d",
            "targets":
              [
                {
                  "refId": "A",
                  "expr": "sum_over_time(fronius:grid_import_watts[$__interval:1m]) / 60 / 1000",
                  "legendFormat": "Netzbezug",
                },
                {
                  "refId": "B",
                  "expr": "sum_over_time(fronius:grid_export_watts[$__interval:1m]) / 60 / 1000",
                  "legendFormat": "Einspeisung",
                },
                {
                  "refId": "C",
                  "expr": "sum_over_time(fronius:self_consumption_watts[$__interval:1m]) / 60 / 1000",
                  "legendFormat": "Eigenverbrauch",
                },
              ],
            "options":
              {
                "legend": { "displayMode": "list", "placement": "bottom" },
                "stacking": "none",
                "xTickLabelRotation": -45,
              },
            "fieldConfig":
              {
                "defaults":
                  {
                    "unit": "kwatth",
                    "decimals": 1,
                    "custom": { "fillOpacity": 80, "lineWidth": 0 },
                  },
                "overrides":
                  [
                    {
                      "matcher": { "id": "byName", "options": "Netzbezug" },
                      "properties":
                        [
                          {
                            "id": "color",
                            "value": { "mode": "fixed", "fixedColor": "red" },
                          },
                        ],
                    },
                    {
                      "matcher": { "id": "byName", "options": "Einspeisung" },
                      "properties":
                        [
                          {
                            "id": "color",
                            "value": { "mode": "fixed", "fixedColor": "green" },
                          },
                        ],
                    },
                    {
                      "matcher": { "id": "byName", "options": "Eigenverbrauch" },
                      "properties":
                        [
                          {
                            "id": "color",
                            "value": { "mode": "fixed", "fixedColor": "orange" },
                          },
                        ],
                    },
                  ],
              },
          },
          {
            "id": 23,
            "type": "stat",
            "title": "Geld im gewaehlten Zeitraum",
            "description": "Netzbezug mal Arbeitspreis, Einspeisung mal Verguetung, Eigenverbrauch als vermiedener Zukauf.",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "gridPos": { "h": 5, "w": 24, "x": 0, "y": 32 },
            "targets":
              [
                {
                  "refId": "A",
                  "expr": "sum_over_time(fronius:grid_import_watts[$__range:1m]) / 60 / 1000 * $arbeitspreis",
                  "legendFormat": "Stromkosten",
                  "instant": true,
                },
                {
                  "refId": "B",
                  "expr": "sum_over_time(fronius:grid_export_watts[$__range:1m]) / 60 / 1000 * $verguetung",
                  "legendFormat": "Einspeiseerloes",
                  "instant": true,
                },
                {
                  "refId": "C",
                  "expr": "sum_over_time(fronius:self_consumption_watts[$__range:1m]) / 60 / 1000 * $arbeitspreis",
                  "legendFormat": "Gespart durch Eigenverbrauch",
                  "instant": true,
                },
              ],
            "options":
              {
                "colorMode": "value",
                "graphMode": "none",
                "textMode": "value_and_name",
                "reduceOptions": { "calcs": ["lastNotNull"] },
              },
            "fieldConfig":
              {
                "defaults": { "unit": "currencyEUR", "decimals": 2 },
                "overrides": [],
              },
          },
          {
            "type": "row",
            "title": "Anlage",
            "gridPos": { "h": 1, "w": 24, "x": 0, "y": 37 },
            "collapsed": true,
            "panels":
              [
                {
                  "id": 30,
                  "type": "stat",
                  "title": "Gesamterzeugung seit Inbetriebnahme",
                  "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "gridPos": { "h": 5, "w": 8, "x": 0, "y": 38 },
                  "targets":
                    [
                      {
                        "refId": "A",
                        "expr": "fronius_site_realtime_data_total_energy_generated / 1000",
                        "instant": true,
                      },
                    ],
                  "options":
                    {
                      "colorMode": "none",
                      "graphMode": "none",
                      "reduceOptions": { "calcs": ["lastNotNull"] },
                    },
                  "fieldConfig":
                    {
                      "defaults": { "unit": "kwatth", "decimals": 0 },
                      "overrides": [],
                    },
                },
                {
                  "id": 31,
                  "type": "timeseries",
                  "title": "Netzfrequenz",
                  "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "gridPos": { "h": 5, "w": 8, "x": 8, "y": 38 },
                  "targets":
                    [
                      {
                        "refId": "A",
                        "expr": "fronius_site_realtime_data_ac_frequency",
                        "legendFormat": "Frequenz",
                      },
                    ],
                  "options":
                    {
                      "legend": { "displayMode": "list", "placement": "bottom" },
                      "tooltip": { "mode": "single" },
                    },
                  "fieldConfig":
                    {
                      "defaults":
                        {
                          "unit": "hertz",
                          "decimals": 2,
                          "custom":
                            {
                              "drawStyle": "line",
                              "lineWidth": 1,
                              "showPoints": "never",
                            },
                        },
                      "overrides": [],
                    },
                },
                {
                  "id": 32,
                  "type": "timeseries",
                  "title": "Exporter",
                  "description": "Scrape-Dauer gegen die Solar API und Fehlerrate.",
                  "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "gridPos": { "h": 5, "w": 8, "x": 16, "y": 38 },
                  "targets":
                    [
                      {
                        "refId": "A",
                        "expr": "fronius_scrape_duration_seconds",
                        "legendFormat": "Scrape-Dauer",
                      },
                      {
                        "refId": "B",
                        "expr": "rate(fronius_scrape_error_count[5m])",
                        "legendFormat": "Fehler/s",
                      },
                    ],
                  "options":
                    {
                      "legend": { "displayMode": "list", "placement": "bottom" },
                      "tooltip": { "mode": "multi" },
                    },
                  "fieldConfig":
                    {
                      "defaults":
                        {
                          "unit": "s",
                          "custom":
                            {
                              "drawStyle": "line",
                              "lineWidth": 1,
                              "showPoints": "never",
                            },
                        },
                      "overrides":
                        [
                          {
                            "matcher": { "id": "byName", "options": "Fehler/s" },
                            "properties":
                              [
                                { "id": "unit", "value": "short" },
                                {
                                  "id": "color",
                                  "value": { "mode": "fixed", "fixedColor": "red" },
                                },
                              ],
                          },
                        ],
                    },
                },
              ],
          },
        ],
    }
