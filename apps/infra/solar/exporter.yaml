apiVersion: apps/v1
kind: Deployment
metadata:
  name: fronius-exporter
  namespace: solar
  labels:
    app.kubernetes.io/name: fronius-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fronius-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fronius-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: ghcr.io/ccremer/fronius-exporter:v0.13.0
          args:
            # CHANGE ME: LAN address of the inverter, give it a DHCP reservation.
            - --symo.url=http://192.168.178.86
            - --bind-addr=:8080
            - --symo.timeout=10
            # Archive data is slow and times out on GEN24 firmware.
            # Enable if you want the per-MPPT voltage/current series.
            - --symo.enable-archive=false
          ports:
            - name: metrics
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: fronius-exporter
  namespace: solar
  labels:
    app.kubernetes.io/name: fronius-exporter
spec:
  selector:
    app.kubernetes.io/name: fronius-exporter
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
