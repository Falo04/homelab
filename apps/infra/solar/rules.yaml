apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fronius
  namespace: solar
  labels:
    app.kubernetes.io/name: fronius-exporter
spec:
  groups:
    - name: fronius.power
      interval: 30s
      rules:
        - record: fronius:grid_import_watts
          expr: clamp_min(fronius_site_power_grid, 0)

        - record: fronius:grid_export_watts
          expr: clamp_min(-fronius_site_power_grid, 0)

        - record: fronius:house_load_watts
          expr: clamp_min(-fronius_site_power_load, 0)

        - record: fronius:self_consumption_watts
          expr: clamp_min(fronius_site_power_photovoltaic - clamp_min(-fronius_site_power_grid, 0), 0)

    - name: fronius.alerts
      rules:
        - alert: FroniusExporterDown
          expr: up{job="fronius-exporter"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Fronius exporter is not reachable"
            description: "Prometheus cannot scrape the exporter, PV data is missing."

        - alert: FroniusInverterUnreachable
          expr: rate(fronius_scrape_error_count[10m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Exporter cannot reach the inverter"
            description: "The Solar API is erroring out. Check the inverter's IP and that the Solar API is still enabled."

        - alert: FroniusNoData
          expr: absent(fronius_site_power_photovoltaic)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "No PV metrics in Prometheus"
            description: "The exporter is up but publishes no power flow data."
