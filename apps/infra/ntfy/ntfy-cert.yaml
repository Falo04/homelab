apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ntfy-cert
  namespace: ntfy
spec:
  secretName: ntfy-tls
  commonName: ntfy.int.felixwallner.com
  dnsNames:
    - ntfy.int.felixwallner.com
  issuerRef:
    name: letsencrypt-dns
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
