# Declarative ntfy users and access tokens.
# keys: `NTFY_AUTH_USERS` / `NTFY_AUTH_TOKENS` (comma-separated, see docs/ntfy.md)
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-ntfy-auth
  namespace: ntfy
spec:
  vaultAuthRef: vault-k8s
  mount: k3s-infra
  type: kv-v2
  path: ntfy/auth
  refreshAfter: 1h
  # ntfy only reads users/tokens at startup, so restart it when they change.
  rolloutRestartTargets:
    - kind: Deployment
      name: ntfy
  destination:
    create: true
    name: ntfy-auth
    labels:
      app.kubernetes.io/part-of: ntfy
