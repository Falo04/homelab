apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ntfy-postgres
  namespace: ntfy
spec:
  instances: 1
  storage:
    size: 2Gi
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: garage-store
