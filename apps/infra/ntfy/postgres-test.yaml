apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ntfy-postgres-test
  namespace: ntfy
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  storage:
    size: 2Gi
  bootstrap:
    recovery:
      source: garage
  externalClusters:
    - name: garage
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: garage-store
          serverName: ntfy-postgres
