apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ntfy

resources:
  - namespace.yaml
  - auth-secret.sops.yaml
  - tailscale-secret.sops.yaml
  - cnpg-backup-secret.sops.yaml
  - backup-values.yaml
  - postgres.yaml
  - deployment.yaml
  - servicemonitor.yaml
  - ntfy-cert.yaml
  - network-policy.yaml

components:
  - ../../../base/cnpg-backup
  - ../../../base/network-policy

patches:
  # The cnpg-backup component still brings a VaultStaticSecret for the apps that
  # haven't moved off Vault yet. Here cnpg-backup-s3 comes from
  # cnpg-backup-secret.sops.yaml instead.
  - patch: |-
      $patch: delete
      apiVersion: secrets.hashicorp.com/v1beta1
      kind: VaultStaticSecret
      metadata:
        name: vault-cnpg-backup

configMapGenerator:
  - name: ntfy-config
    namespace: ntfy
    files:
      - server.yml
