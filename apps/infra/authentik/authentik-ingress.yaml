apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik-ingress
  namespace: authentik
spec:
  entryPoints:
    - tailscale
  tls:
    secretName: authentik-tls
  routes:
    - match: Host(`sso.int.felixwallner.com`)
      kind: Rule
      services:
        - name: authentik-server
          port: 80
