name: Kustomize

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: kustomize build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install kustomize
        env:
          # renovate: datasource=github-releases depName=kubernetes-sigs/kustomize extractVersion=^kustomize/v(?<version>.+)$
          KUSTOMIZE_VERSION: 5.8.3
        run: |
          base="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}"
          tarball="kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/checksums.txt" | grep " ${tarball}\$" | sha256sum -c -
          tar -xzf "$tarball" -C /usr/local/bin kustomize
          kustomize version

      - name: Build every kustomization
        run: ./scripts/kustomize-build-all.sh
